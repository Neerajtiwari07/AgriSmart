services:

  backend:
    build:
      context: ./backend

    container_name: agrismart_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: agrismart_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped